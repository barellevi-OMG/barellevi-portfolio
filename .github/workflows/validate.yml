name: Validate private portfolio draft
on:
  push:
    branches:
      - 'develop/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/data.js
      - run: node --check src/app.js
      - run: node --check tests/check.mjs
      - run: node tests/check.mjs
