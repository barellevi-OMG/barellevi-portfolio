name: Public site visual examples
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate public UI and capture examples
        run: node tests/public-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-portfolio-examples
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
